<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">TeraSupport Visual Deployment Overview</title>
  <desc id="desc">High-level deployment diagram showing users, public entry point, web app, API gateway, microservices, PostgreSQL databases, Kafka, Kafdrop, file storage, and SMTP.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:8}
      .entry{fill:#ecfeff;stroke:#0891b2}
      .web{fill:#eef2ff;stroke:#4f46e5}
      .gateway{fill:#fff7ed;stroke:#ea580c}
      .svc{fill:#f0fdf4;stroke:#16a34a}
      .db{fill:#fefce8;stroke:#ca8a04}
      .event{fill:#fdf2f8;stroke:#db2777}
      .external{fill:#f1f5f9;stroke:#64748b}
      .line{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke-dasharray:8 6}
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}
      .label{font:700 15px Arial,sans-serif;fill:#0f172a}
      .small{font:13px Arial,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect class="bg" width="1280" height="760" />
  <text class="title" x="40" y="52">TeraSupport Deployment Overview</text>
  <text class="small" x="42" y="78">.NET 9 CQRS/MediatR microservices with Ocelot, PostgreSQL, Kafka, and React/Vite web frontend</text>

  <rect class="box entry" x="40" y="150" width="190" height="96" />
  <text class="label" x="72" y="186">System Users</text>
  <text class="small" x="66" y="212">Facility, Regional,</text>
  <text class="small" x="75" y="232">National, Admin</text>

  <rect class="box entry" x="285" y="150" width="190" height="96" />
  <text class="label" x="329" y="186">Public HTTPS</text>
  <text class="small" x="325" y="212">IIS, Nginx, or</text>
  <text class="small" x="326" y="232">external load balancer</text>

  <rect class="box web" x="530" y="150" width="190" height="96" />
  <text class="label" x="572" y="187">React Web App</text>
  <text class="small" x="588" y="213">Vite build</text>

  <rect class="box gateway" x="775" y="150" width="190" height="96" />
  <text class="label" x="819" y="187">API Gateway</text>
  <text class="small" x="820" y="213">Ocelot routing</text>
  <text class="small" x="821" y="233">/ts-api, /swagger</text>

  <path class="line" d="M230 198 H285" />
  <path class="line" d="M475 198 H530" />
  <path class="line" d="M720 198 H775" />

  <g>
    <rect class="box svc" x="1030" y="95" width="190" height="54" />
    <text class="label" x="1067" y="128">User Service</text>
    <rect class="box svc" x="1030" y="165" width="190" height="54" />
    <text class="label" x="1052" y="198">Ticketing Service</text>
    <rect class="box svc" x="1030" y="235" width="190" height="54" />
    <text class="label" x="1072" y="268">CRM Service</text>
    <rect class="box svc" x="1030" y="305" width="190" height="54" />
    <text class="label" x="1048" y="338">Call Center Service</text>
    <rect class="box svc" x="1030" y="375" width="190" height="54" />
    <text class="label" x="1046" y="408">Device Mgmt Service</text>
    <rect class="box svc" x="1030" y="445" width="190" height="54" />
    <text class="label" x="1072" y="478">Mail Service</text>
    <rect class="box svc" x="1030" y="515" width="190" height="54" />
    <text class="label" x="1074" y="548">Meta Service</text>
  </g>

  <path class="line" d="M965 198 C990 122 1000 122 1030 122" />
  <path class="line" d="M965 198 H1030" />
  <path class="line" d="M965 198 C992 262 1000 262 1030 262" />
  <path class="line" d="M965 198 C990 332 1000 332 1030 332" />
  <path class="line" d="M965 198 C990 402 1000 402 1030 402" />
  <path class="line" d="M965 198 C990 472 1000 472 1030 472" />
  <path class="line" d="M965 198 C990 542 1000 542 1030 542" />

  <rect class="box db" x="1015" y="620" width="220" height="72" />
  <text class="label" x="1057" y="650">PostgreSQL Databases</text>
  <text class="small" x="1050" y="674">User, Ticket, CRM, Mail,</text>
  <text class="small" x="1063" y="692">Call Center, Device, Meta</text>
  <path class="line" d="M1125 569 V620" />

  <rect class="box event" x="530" y="430" width="190" height="88" />
  <text class="label" x="588" y="462">Kafka</text>
  <text class="small" x="570" y="488">Event bus and topics</text>
  <path class="line dash" d="M1030 472 C900 470 830 470 720 474" />
  <path class="line dash" d="M1030 192 C900 250 835 350 720 474" />

  <rect class="box event" x="285" y="430" width="190" height="88" />
  <text class="label" x="341" y="462">Kafdrop</text>
  <text class="small" x="324" y="488">Topic monitoring UI</text>
  <path class="line" d="M530 474 H475" />

  <rect class="box external" x="530" y="610" width="190" height="72" />
  <text class="label" x="577" y="642">File Storage</text>
  <text class="small" x="568" y="666">wwwroot attachments</text>
  <path class="line dash" d="M1030 192 C870 310 750 498 695 610" />

  <rect class="box external" x="285" y="610" width="190" height="72" />
  <text class="label" x="331" y="642">SMTP Gateway</text>
  <text class="small" x="331" y="666">Email notifications</text>
  <path class="line dash" d="M1030 472 C790 552 610 610 475 646" />
</svg>
