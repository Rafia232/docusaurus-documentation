  <text class="head" x="677" y="393">Companies</text>
  <text class="field" x="677" y="418">Facility records</text>
  <text class="field" x="677" y="440">RegionId</text>
  <text class="field" x="677" y="462">FacilityCode</text>
  <rect class="box2" x="855" y="365" width="160" height="118"/>
  <text class="head" x="877" y="393">Contacts</text>
  <text class="field" x="877" y="418">FullName</text>
  <text class="field" x="877" y="440">Email, Phone</text>
  <text class="field" x="877" y="462">CompanyId</text>
  <path class="rel" d="M803 310 C770 330 745 345 745 365"/>
  <path class="rel" d="M835 424 L855 424"/>
  <path class="dash" d="M735 255 C600 250 420 230 285 245"/>
