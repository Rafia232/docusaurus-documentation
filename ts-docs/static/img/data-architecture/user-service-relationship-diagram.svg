  <rect class="group" x="50" y="560" width="500" height="270"/>
  <text class="groupTitle" x="75" y="594">Departments</text>
  <rect class="box4" x="95" y="655" width="170" height="105"/>
  <text class="head" x="115" y="683">Departments</text>
  <text class="field" x="115" y="708">PK Oid</text>
  <text class="field" x="115" y="730">Name</text>
  <rect class="box4" x="320" y="655" width="200" height="105"/>
  <text class="head" x="340" y="683">UserDepartments</text>
  <text class="field" x="340" y="708">DepartmentId</text>
  <text class="field" x="340" y="730">IdentifiedUserId</text>
  <path class="rel" d="M265 708 L320 708"/>
  <path class="dash" d="M420 655 C390 575 335 515 290 475"/>
  <text class="label" x="315" y="625">department membership</text>

  <rect class="group" x="610" y="560" width="940" height="270"/>
  <text class="groupTitle" x="635" y="594">Organization Services and Automation</text>
  <rect class="box" x="660" y="655" width="230" height="105"/>
  <text class="head" x="680" y="683">AssignedOrganizationServices</text>
  <text class="field" x="680" y="708">OrganizationId</text>
  <text class="field" x="680" y="730">Service</text>
  <rect class="box2" x="940" y="655" width="190" height="105"/>
  <text class="head" x="960" y="683">AutomationRules</text>
  <text class="field" x="960" y="708">ServiceType</text>
  <text class="field" x="960" y="730">EventType</text>
  <rect class="box2" x="1180" y="655" width="190" height="105"/>
  <text class="head" x="1200" y="683">AutomationChannels</text>
  <text class="field" x="1200" y="708">AutomationRuleId</text>
  <text class="field" x="1200" y="730">Channel</text>
