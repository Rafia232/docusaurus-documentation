  <text class="field" x="1145" y="258">UserAccountId</text>
  <text class="field" x="1145" y="280">Services</text>
  <rect class="box3" x="1330" y="205" width="180" height="112"/>
  <text class="head" x="1350" y="233">IdentifiedUserRoles</text>
  <text class="field" x="1350" y="258">AccessId</text>
  <text class="field" x="1350" y="280">Roles</text>
  <rect class="box3" x="1195" y="365" width="230" height="118"/>
  <text class="head" x="1215" y="393">IdentifiedRoleActions</text>
  <text class="field" x="1215" y="418">Role</text>
  <text class="field" x="1215" y="440">Feature</text>
  <text class="field" x="1215" y="462">ActionType</text>
  <path class="rel" d="M1315 261 L1330 261"/>
  <path class="dash" d="M1420 317 C1420 345 1390 358 1375 365"/>
  <path class="dash" d="M1125 256 C930 220 500 190 285 232"/>
