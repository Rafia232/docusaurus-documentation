  <text class="field" x="1428" y="730">Role</text>
  <path class="dash" d="M660 705 C560 650 460 465 415 331"/>
  <path class="dash" d="M940 705 C780 610 520 430 415 331"/>
  <path class="rel" d="M1130 708 L1180 708"/>
  <path class="rel" d="M1370 708 L1410 708"/>
  <text class="label" x="665" y="640">organization enables services</text>
  <text class="label" x="930" y="640">rules belong to organization</text>
</svg>
