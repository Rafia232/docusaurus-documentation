<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 32px Arial,sans-serif;fill:#111827}
      .subtitle{font:400 16px Arial,sans-serif;fill:#4b5563}
      .group{fill:#ffffff;stroke:#d1d5db;stroke-width:2;rx:16}
      .groupTitle{font:700 18px Arial,sans-serif;fill:#374151}
      .box{fill:#eef2ff;stroke:#6d5dfc;stroke-width:2;rx:10}
      .box2{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:10}
      .box3{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:10}
      .box4{fill:#fdf2f8;stroke:#ec4899;stroke-width:2;rx:10}
      .head{font:700 15px Arial,sans-serif;fill:#111827}
      .field{font:400 13px Arial,sans-serif;fill:#374151}
      .rel{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#arrow)}
      .label{font:600 12px Arial,sans-serif;fill:#475569}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="56" y="58">User Service Relationship Diagram</text>
  <text class="subtitle" x="56" y="88">Migrated User Service entities for identity, organization, facilities, access control, departments, and notification automation.</text>

  <rect class="group" x="50" y="130" width="500" height="370"/>
  <text class="groupTitle" x="75" y="164">Identity and Organization</text>
  <rect class="box" x="85" y="205" width="200" height="126"/>
  <text class="head" x="105" y="233">UserAccounts</text>
  <text class="field" x="105" y="258">PK Oid</text>
  <text class="field" x="105" y="280">Email, Name, Cellphone</text>
  <text class="field" x="105" y="302">RegionId, UserType</text>
  <rect class="box" x="315" y="205" width="200" height="126"/>
  <text class="head" x="335" y="233">Organizations</text>
  <text class="field" x="335" y="258">PK Oid</text>
  <text class="field" x="335" y="280">Name, Suffix, Status</text>
  <text class="field" x="335" y="302">Portal flags</text>
  <rect class="box" x="180" y="370" width="220" height="105"/>
  <text class="head" x="200" y="398">IdentifiedOrganizations</text>
  <text class="field" x="200" y="423">UserAccountId</text>
  <text class="field" x="200" y="445">OrganizationId</text>
  <text class="field" x="200" y="467">IsAdministrator</text>
  <rect class="box" x="420" y="370" width="105" height="105"/>
  <text class="head" x="438" y="398">Login</text>
  <text class="field" x="438" y="423">History</text>
  <text class="field" x="438" y="445">UserId</text>
  <path class="rel" d="M285 268 C330 285 295 355 220 370"/>
  <path class="rel" d="M415 331 C415 350 395 365 400 422"/>
  <path class="rel" d="M285 250 C365 255 470 295 472 370"/>
  <text class="label" x="116" y="360">user assigned</text>
  <text class="label" x="407" y="355">organization owns</text>

  <rect class="group" x="610" y="130" width="430" height="370"/>
  <text class="groupTitle" x="635" y="164">Facility and Region</text>
  <rect class="box2" x="735" y="205" width="180" height="105"/>
  <text class="head" x="757" y="233">Regions</text>
  <text class="field" x="757" y="258">PK Oid</text>
  <text class="field" x="757" y="280">Name</text>
