  <text class="field" x="645" y="288">SLNumber, TicketTitle, Description</text>
  <text class="field" x="645" y="310">IncidentStatus, Source, Priority</text>
  <text class="field" x="645" y="332">DueDate, DateResolved</text>
  <text class="field" x="645" y="354">FacilityId, ContactId, Expert references</text>
  <text class="field" x="645" y="376">CategoryId, ApplicationId, OrganizationId</text>

  <rect class="group" x="60" y="135" width="390" height="320"/>
