  <rect class="box" x="1145" y="610" width="160" height="95"/>
  <text class="head" x="1165" y="638">FacilityId</text>
  <text class="field" x="1165" y="663">User Service</text>
  <text class="field" x="1165" y="685">Companies.Oid</text>
  <rect class="box" x="1335" y="610" width="160" height="95"/>
