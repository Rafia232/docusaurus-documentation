  <text class="field" x="315" y="268">PK Oid</text>
  <text class="field" x="315" y="290">Name</text>
  <path class="rel" d="M195 310 L195 345"/>
  <path class="rel" d="M280 262 C410 245 500 250 615 286"/>
  <path class="rel" d="M420 262 C500 260 555 275 615 304"/>

  <rect class="group" x="1140" y="135" width="400" height="320"/>
