<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px Arial,sans-serif;fill:#111827}.subtitle{font:400 16px Arial,sans-serif;fill:#475569}.band{fill:#ffffff;stroke:#d1d5db;stroke-width:2;rx:18}.bandTitle{font:700 18px Arial,sans-serif;fill:#374151}.box{fill:#eef2ff;stroke:#6d5dfc;stroke-width:2;rx:12}.svc{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.data{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.qa{fill:#fdf2f8;stroke:#ec4899;stroke-width:2;rx:12}.head{font:700 16px Arial,sans-serif;fill:#111827}.text{font:400 13px Arial,sans-serif;fill:#374151}.arrow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1500" height="880"/>
  <text class="title" x="54" y="58">Deployment and Testing Flow</text>
  <text class="subtitle" x="54" y="88">Production validation path for the web app, Ocelot gateway, supported .NET services, Kafka, PostgreSQL, and release checks.</text>

  <rect class="band" x="45" y="125" width="1410" height="170"/>
  <text class="bandTitle" x="70" y="158">1. User Entry and Web Layer</text>
  <rect class="box" x="90" y="190" width="205" height="76"/><text class="head" x="116" y="220">End Users</text><text class="text" x="116" y="245">Facility, Regional, National</text>
  <rect class="box" x="375" y="190" width="210" height="76"/><text class="head" x="405" y="220">HTTPS Entry</text><text class="text" x="405" y="245">IIS / Nginx / Load Balancer</text>
  <rect class="box" x="665" y="190" width="215" height="76"/><text class="head" x="698" y="220">React Web App</text><text class="text" x="698" y="245">Static SPA delivery</text>
  <rect class="box" x="960" y="190" width="220" height="76"/><text class="head" x="1000" y="220">Ocelot Gateway</text><text class="text" x="1000" y="245">Routes API traffic</text>
  <path class="arrow" d="M295 228 L375 228"/><path class="arrow" d="M585 228 L665 228"/><path class="arrow" d="M880 228 L960 228"/>

  <rect class="band" x="45" y="330" width="1410" height="180"/>
  <text class="bandTitle" x="70" y="363">2. Supported Service Layer</text>
  <rect class="svc" x="175" y="395" width="220" height="80"/><text class="head" x="218" y="426">User Service</text><text class="text" x="215" y="451">Identity, roles, organizations</text>
  <rect class="svc" x="515" y="395" width="220" height="80"/><text class="head" x="552" y="426">Ticketing Service</text><text class="text" x="550" y="451">Tickets, reports, SLA flow</text>
  <rect class="svc" x="855" y="395" width="220" height="80"/><text class="head" x="902" y="426">Mail Service</text><text class="text" x="900" y="451">SMTP and mail workers</text>
  <path class="arrow" d="M1070 266 C1070 330 985 360 965 395"/><path class="arrow" d="M1070 266 C960 330 760 365 625 395"/><path class="arrow" d="M1070 266 C850 315 520 360 285 395"/>

  <rect class="band" x="45" y="545" width="900" height="245"/>
  <text class="bandTitle" x="70" y="578">3. Data, Messaging, and Files</text>
  <rect class="data" x="95" y="620" width="170" height="74"/><text class="head" x="130" y="650">TSUserDB</text><text class="text" x="130" y="674">PostgreSQL</text>
  <rect class="data" x="305" y="620" width="170" height="74"/><text class="head" x="338" y="650">TSTicketDb</text><text class="text" x="340" y="674">PostgreSQL</text>
  <rect class="data" x="515" y="620" width="170" height="74"/><text class="head" x="555" y="650">TSMailDB</text><text class="text" x="552" y="674">PostgreSQL</text>
  <rect class="data" x="725" y="620" width="170" height="74"/><text class="head" x="780" y="650">Kafka</text><text class="text" x="750" y="674">Async events</text>
  <rect class="data" x="230" y="725" width="220" height="48"/><text class="head" x="260" y="756">Attachment Storage</text>
  <rect class="data" x="520" y="725" width="220" height="48"/><text class="head" x="555" y="756">SMTP Gateway</text>
  <path class="dash" d="M285 475 L180 620"/><path class="dash" d="M625 475 L390 620"/><path class="dash" d="M965 475 L600 620"/><path class="dash" d="M625 475 C700 530 760 565 810 620"/>

  <rect class="band" x="985" y="545" width="470" height="245"/>
  <text class="bandTitle" x="1010" y="578">4. Validation and Release</text>
  <rect class="qa" x="1035" y="625" width="170" height="68"/><text class="head" x="1062" y="654">Smoke Test</text><text class="text" x="1062" y="677">Startup checks</text>
  <rect class="qa" x="1245" y="625" width="170" height="68"/><text class="head" x="1272" y="654">API Health</text><text class="text" x="1272" y="677">Gateway routes</text>
  <rect class="qa" x="1035" y="725" width="170" height="68"/><text class="head" x="1062" y="754">Workflow QA</text><text class="text" x="1062" y="777">Ticket lifecycle</text>
  <rect class="qa" x="1245" y="725" width="170" height="68"/><text class="head" x="1266" y="754">Release Sign-off</text><text class="text" x="1272" y="777">Go-live approval</text>
</svg>
