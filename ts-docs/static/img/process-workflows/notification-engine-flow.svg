<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="590" viewBox="0 0 1500 590">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 30px Arial;fill:#111827}.sub{font:400 15px Arial;fill:#475569}.box{fill:#eef2ff;stroke:#6d5dfc;stroke-width:2;rx:12}.ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.mail{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.h{font:700 15px Arial;fill:#111827}.t{font:400 13px Arial;fill:#374151}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#m)}.d{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1500" height="590"/><text class="title" x="50" y="55">Notification Engine Flow</text><text class="sub" x="50" y="84">Ticket events are published asynchronously, consumed by workers, rendered through templates, and delivered through configured channels.</text>
  <rect class="box" x="90" y="205" width="190" height="90"/><text class="h" x="115" y="238">Ticket command</text><text class="t" x="115" y="263">Create, assign,</text><text class="t" x="115" y="283">close or reopen</text>
  <rect class="ok" x="350" y="205" width="190" height="90"/><text class="h" x="375" y="238">Publish event</text><text class="t" x="375" y="263">Event payload sent</text><text class="t" x="375" y="283">to Kafka topic</text>
  <rect class="ok" x="610" y="205" width="190" height="90"/><text class="h" x="635" y="238">Worker consumes</text><text class="t" x="635" y="263">Background service</text><text class="t" x="635" y="283">handles event</text>
  <rect class="mail" x="870" y="205" width="190" height="90"/><text class="h" x="895" y="238">Render template</text><text class="t" x="895" y="263">Event data fills</text><text class="t" x="895" y="283">message body</text>
  <rect class="mail" x="1130" y="205" width="190" height="90"/><text class="h" x="1155" y="238">Deliver message</text><text class="t" x="1155" y="263">SMTP or enabled</text><text class="t" x="1155" y="283">channel sends alert</text>
  <rect class="box" x="610" y="390" width="190" height="70"/><text class="h" x="635" y="421">UI already returned</text><text class="t" x="635" y="443">User is not blocked</text>
  <path class="a" d="M280 250 L350 250"/><path class="a" d="M540 250 L610 250"/><path class="a" d="M800 250 L870 250"/><path class="a" d="M1060 250 L1130 250"/><path class="d" d="M445 295 C490 390 560 425 610 425"/>
</svg>
