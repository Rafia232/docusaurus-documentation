<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 30px Arial;fill:#111827}.sub{font:400 15px Arial;fill:#475569}.box{fill:#eef2ff;stroke:#6d5dfc;stroke-width:2;rx:12}.ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.err{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:12}.h{font:700 15px Arial;fill:#111827}.t{font:400 13px Arial;fill:#374151}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#m)}.d{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1500" height="680"/><text class="title" x="50" y="55">Ticket Resolution Flow</text><text class="sub" x="50" y="84">Expert records a resolution, the ticket closes, notifications are sent, and the reopen window is monitored.</text>
  <rect class="box" x="80" y="155" width="180" height="86"/><text class="h" x="105" y="188">Open assignment</text><text class="t" x="105" y="213">Expert opens the</text><text class="t" x="105" y="233">assigned ticket</text>
  <rect class="box" x="320" y="155" width="180" height="86"/><text class="h" x="345" y="188">Enter resolution</text><text class="t" x="345" y="213">Resolution details</text><text class="t" x="345" y="233">are provided</text>
  <rect class="warn" x="560" y="155" width="180" height="86"/><text class="h" x="585" y="188">Validate details</text><text class="t" x="585" y="213">Required quality</text><text class="t" x="585" y="233">checks pass</text>
  <rect class="ok" x="800" y="155" width="180" height="86"/><text class="h" x="825" y="188">Close ticket</text><text class="t" x="825" y="213">Status and resolved</text><text class="t" x="825" y="233">date are updated</text>
  <rect class="ok" x="1040" y="155" width="180" height="86"/><text class="h" x="1065" y="188">Append message</text><text class="t" x="1065" y="213">Resolution note is</text><text class="t" x="1065" y="233">stored in thread</text>
  <rect class="ok" x="1040" y="330" width="180" height="86"/><text class="h" x="1065" y="363">Notify reporter</text><text class="t" x="1065" y="388">Closed event sent</text><text class="t" x="1065" y="408">to workers</text>
  <rect class="warn" x="800" y="330" width="180" height="86"/><text class="h" x="825" y="363">Reopen window</text><text class="t" x="825" y="388">Reporter can reply</text><text class="t" x="825" y="408">within policy</text>
  <rect class="ok" x="560" y="330" width="180" height="86"/><text class="h" x="585" y="363">Finalize or reopen</text><text class="t" x="585" y="388">No reply finalizes,</text><text class="t" x="585" y="408">reply reopens</text>
  <rect class="err" x="560" y="500" width="180" height="70"/><text class="h" x="585" y="531">Validation error</text><text class="t" x="585" y="553">Ask for better detail</text>
  <path class="a" d="M260 198 L320 198"/><path class="a" d="M500 198 L560 198"/><path class="a" d="M740 198 L800 198"/><path class="a" d="M980 198 L1040 198"/><path class="a" d="M1130 241 L1130 330"/><path class="a" d="M1040 373 L980 373"/><path class="a" d="M800 373 L740 373"/><path class="d" d="M650 241 L650 500"/>
</svg>
