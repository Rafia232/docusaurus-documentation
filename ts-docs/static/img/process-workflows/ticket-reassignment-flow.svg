<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 30px Arial;fill:#111827}.sub{font:400 15px Arial;fill:#475569}.box{fill:#eef2ff;stroke:#6d5dfc;stroke-width:2;rx:12}.ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.err{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:12}.h{font:700 15px Arial;fill:#111827}.t{font:400 13px Arial;fill:#374151}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#m)}.d{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1500" height="600"/><text class="title" x="50" y="55">Ticket Reassignment Flow</text><text class="sub" x="50" y="84">A ticket can be moved to another expert after validation, with assignment history retained for audit and escalation reporting.</text>
  <rect class="box" x="80" y="170" width="190" height="86"/><text class="h" x="105" y="203">Open details</text><text class="t" x="105" y="228">Agent opens current</text><text class="t" x="105" y="248">ticket details</text>
  <rect class="box" x="335" y="170" width="190" height="86"/><text class="h" x="360" y="203">Choose new expert</text><text class="t" x="360" y="228">Select replacement</text><text class="t" x="360" y="248">assignee</text>
  <rect class="warn" x="590" y="170" width="190" height="86"/><text class="h" x="615" y="203">Validate expert</text><text class="t" x="615" y="228">Must be active and</text><text class="t" x="615" y="248">valid for team</text>
  <rect class="ok" x="845" y="170" width="190" height="86"/><text class="h" x="870" y="203">Record reassignment</text><text class="t" x="870" y="228">Assignment history</text><text class="t" x="870" y="248">is preserved</text>
  <rect class="ok" x="1100" y="170" width="190" height="86"/><text class="h" x="1125" y="203">Notify new owner</text><text class="t" x="1125" y="228">Kafka/mail workers</text><text class="t" x="1125" y="248">send alerts</text>
  <rect class="err" x="590" y="360" width="190" height="78"/><text class="h" x="615" y="392">Stop and show error</text><text class="t" x="615" y="416">Invalid expert/team</text>
  <path class="a" d="M270 213 L335 213"/><path class="a" d="M525 213 L590 213"/><path class="a" d="M780 213 L845 213"/><path class="a" d="M1035 213 L1100 213"/><path class="d" d="M685 256 L685 360"/>
</svg>
