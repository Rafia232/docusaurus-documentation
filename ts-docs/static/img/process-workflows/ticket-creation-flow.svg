<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 30px Arial;fill:#111827}.sub{font:400 15px Arial;fill:#475569}.box{fill:#eef2ff;stroke:#6d5dfc;stroke-width:2;rx:12}.ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.err{fill:#fef2f2;stroke:#ef4444;stroke-width:2;rx:12}.h{font:700 15px Arial;fill:#111827}.t{font:400 13px Arial;fill:#374151}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#m)}.d{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1500" height="640"/>
  <text class="title" x="50" y="55">Facility User Ticket Creation Flow</text>
  <text class="sub" x="50" y="84">Facility user creates a ticket, the system validates it, maps category/team, and starts notification handling.</text>
  <rect class="box" x="70" y="150" width="180" height="86"/><text class="h" x="95" y="183">Sign in</text><text class="t" x="95" y="208">Facility user opens</text><text class="t" x="95" y="228">self-service portal</text>
  <rect class="box" x="315" y="150" width="185" height="86"/><text class="h" x="340" y="183">Open ticket form</text><text class="t" x="340" y="208">Enter title, details,</text><text class="t" x="340" y="228">category and device</text>
  <rect class="box" x="565" y="150" width="185" height="86"/><text class="h" x="590" y="183">Attach files</text><text class="t" x="590" y="208">Optional supporting</text><text class="t" x="590" y="228">documents/images</text>
  <rect class="warn" x="815" y="150" width="185" height="86"/><text class="h" x="840" y="183">Validate input</text><text class="t" x="840" y="208">Required fields and</text><text class="t" x="840" y="228">attachment limits</text>
  <rect class="ok" x="1065" y="150" width="185" height="86"/><text class="h" x="1090" y="183">Create ticket</text><text class="t" x="1090" y="208">Ticketing service</text><text class="t" x="1090" y="228">stores incident</text>
  <rect class="ok" x="1065" y="330" width="185" height="86"/><text class="h" x="1090" y="363">Route ticket</text><text class="t" x="1090" y="388">Category mapping</text><text class="t" x="1090" y="408">selects team</text>
  <rect class="ok" x="815" y="330" width="185" height="86"/><text class="h" x="840" y="363">Assign or queue</text><text class="t" x="840" y="388">Team lead assigned</text><text class="t" x="840" y="408">or triage queue</text>
  <rect class="ok" x="565" y="330" width="185" height="86"/><text class="h" x="590" y="363">Publish event</text><text class="t" x="590" y="388">Ticket-created</text><text class="t" x="590" y="408">event to Kafka</text>
  <rect class="ok" x="315" y="330" width="185" height="86"/><text class="h" x="340" y="363">Notify users</text><text class="t" x="340" y="388">Email/alert workers</text><text class="t" x="340" y="408">send updates</text>
  <rect class="err" x="815" y="485" width="185" height="70"/><text class="h" x="840" y="516">Validation errors</text><text class="t" x="840" y="538">Show form messages</text>
  <path class="a" d="M250 193 L315 193"/><path class="a" d="M500 193 L565 193"/><path class="a" d="M750 193 L815 193"/><path class="a" d="M1000 193 L1065 193"/><path class="a" d="M1158 236 L1158 330"/><path class="a" d="M1065 373 L1000 373"/><path class="a" d="M815 373 L750 373"/><path class="a" d="M565 373 L500 373"/><path class="d" d="M908 236 L908 485"/>
</svg>
