<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
  <defs><style>.bg{fill:#f8fafc}.title{font:700 30px Arial;fill:#111827}.sub{font:400 15px Arial;fill:#475569}.lane{fill:#fff;stroke:#d1d5db;stroke-width:2;rx:16}.box{fill:#eef2ff;stroke:#6d5dfc;stroke-width:2;rx:12}.ok{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.h{font:700 15px Arial;fill:#111827}.t{font:400 13px Arial;fill:#374151}.a{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1500" height="560"/><text class="title" x="50" y="55">Ticket Assignment Flow</text><text class="sub" x="50" y="84">Service Desk selects an expert, Ticketing records the assignment, and the user interface reflects the new owner.</text>
  <rect class="lane" x="60" y="130" width="1320" height="300"/>
  <rect class="box" x="100" y="220" width="180" height="86"/><text class="h" x="125" y="253">Open ticket</text><text class="t" x="125" y="278">Agent reviews ticket</text><text class="t" x="125" y="298">details page</text>
  <rect class="box" x="335" y="220" width="190" height="86"/><text class="h" x="360" y="253">Load experts</text><text class="t" x="360" y="278">Eligible team experts</text><text class="t" x="360" y="298">are listed</text>
  <rect class="box" x="580" y="220" width="190" height="86"/><text class="h" x="605" y="253">Select assignee</text><text class="t" x="605" y="278">Agent chooses the</text><text class="t" x="605" y="298">responsible expert</text>
  <rect class="ok" x="825" y="220" width="190" height="86"/><text class="h" x="850" y="253">Save assignment</text><text class="t" x="850" y="278">Assignment row is</text><text class="t" x="850" y="298">created/updated</text>
  <rect class="ok" x="1070" y="220" width="190" height="86"/><text class="h" x="1095" y="253">Update status</text><text class="t" x="1095" y="278">Ticket moves to</text><text class="t" x="1095" y="298">in-progress state</text>
  <path class="a" d="M280 263 L335 263"/><path class="a" d="M525 263 L580 263"/><path class="a" d="M770 263 L825 263"/><path class="a" d="M1015 263 L1070 263"/>
  <text class="t" x="100" y="475">Result: the latest allowed assignment becomes the ticket owner and is used later by reports, escalation history, and workflow filters.</text>
</svg>
