  <text class="field" x="1135" y="713">AutomationRuleId</text>
  <text class="field" x="1135" y="735">Channel</text>
  <rect class="box2" x="1355" y="660" width="155" height="105"/>
  <text class="head" x="1375" y="688">AutomationRoles</text>
  <text class="field" x="1375" y="713">ChannelId</text>
  <text class="field" x="1375" y="735">Role</text>
  <rect class="box3" x="875" y="815" width="190" height="95"/>
  <text class="head" x="895" y="843">UserRequests</text>
  <text class="field" x="895" y="868">OrganizationName</text>
  <text class="field" x="895" y="890">RequestStatus</text>
  <path class="dash" d="M595 712 C480 610 430 490 430 311"/>
  <path class="dash" d="M875 712 C720 610 495 425 430 311"/>
  <path class="rel" d="M1065 712 L1115 712"/>
  <path class="rel" d="M1305 712 L1355 712"/>
</svg>
