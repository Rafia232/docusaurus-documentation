  <text class="field" x="742" y="238">PK Oid</text>
  <text class="field" x="742" y="260">Name</text>
  <rect class="box2" x="645" y="360" width="180" height="118"/>
  <text class="head" x="667" y="388">Companies</text>
  <text class="field" x="667" y="413">Facility records</text>
  <text class="field" x="667" y="435">RegionId</text>
  <text class="field" x="667" y="457">FacilityCode</text>
  <rect class="box2" x="845" y="360" width="160" height="118"/>
  <text class="head" x="867" y="388">Contacts</text>
  <text class="field" x="867" y="413">FullName</text>
  <text class="field" x="867" y="435">Email, Phone</text>
  <text class="field" x="867" y="457">CompanyId</text>
  <path class="rel" d="M788 290 C760 320 735 330 735 360"/>
  <text class="label" x="675" y="326">contains</text>
  <path class="rel" d="M825 419 L845 419"/>
  <text class="label" x="813" y="404">has</text>
  <path class="dash" d="M900 236 C985 236 1048 110 268 210"/>
  <text class="label" x="923" y="210">users can be tied to regions</text>

  <rect class="group" x="1080" y="125" width="470" height="410"/>
  <text class="groupTitle" x="1105" y="158">Service Access and Permissions</text>
  <rect class="box3" x="1125" y="185" width="190" height="112"/>
  <text class="head" x="1145" y="213">IdentifiedUserAccesses</text>
  <text class="field" x="1145" y="238">UserAccountId</text>
  <text class="field" x="1145" y="260">Services</text>
  <rect class="box3" x="1330" y="185" width="180" height="112"/>
  <text class="head" x="1350" y="213">IdentifiedUserRoles</text>
  <text class="field" x="1350" y="238">AccessId</text>
  <text class="field" x="1350" y="260">Roles</text>
