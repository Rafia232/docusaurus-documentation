  <path class="rel" d="M430 311 C430 350 395 370 410 428"/>
  <text class="label" x="424" y="350">organization owns</text>
  <rect class="box" x="70" y="342" width="125" height="105"/>
  <text class="head" x="88" y="370">Biometrics</text>
  <text class="field" x="88" y="395">PK Oid</text>
  <text class="field" x="88" y="417">Fingerprint</text>
  <path class="rel" d="M145 311 L145 342"/>
  <rect class="box" x="420" y="342" width="110" height="105"/>
  <text class="head" x="438" y="370">Login</text>
  <text class="field" x="438" y="395">History</text>
  <text class="field" x="438" y="417">UserId</text>
  <path class="rel" d="M270 245 C360 245 475 285 475 342"/>

  <rect class="group" x="600" y="125" width="440" height="410"/>
