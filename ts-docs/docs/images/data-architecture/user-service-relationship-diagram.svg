<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 32px Arial,sans-serif;fill:#111827}
      .subtitle{font:400 16px Arial,sans-serif;fill:#4b5563}
      .group{fill:#ffffff;stroke:#d1d5db;stroke-width:2;rx:16}
      .groupTitle{font:700 18px Arial,sans-serif;fill:#374151}
      .box{fill:#eef2ff;stroke:#6d5dfc;stroke-width:2;rx:10}
      .box2{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:10}
      .box3{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:10}
      .box4{fill:#fdf2f8;stroke:#ec4899;stroke-width:2;rx:10}
      .head{font:700 15px Arial,sans-serif;fill:#111827}
      .field{font:400 13px Arial,sans-serif;fill:#374151}
      .rel{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#arrow)}
      .label{font:600 12px Arial,sans-serif;fill:#475569}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="1050"/>
  <text class="title" x="56" y="58">User Service Relationship Diagram</text>
  <text class="subtitle" x="56" y="88">Migrated User Service entities for identity, organization, facilities, access control, packages, and notification automation.</text>

  <rect class="group" x="40" y="125" width="520" height="410"/>
  <text class="groupTitle" x="65" y="158">Identity and Organization</text>
  <rect class="box" x="70" y="185" width="200" height="126"/>
  <text class="head" x="90" y="213">UserAccounts</text>
  <text class="field" x="90" y="238">PK Oid</text>
  <text class="field" x="90" y="260">Email, Name, Cellphone</text>
  <text class="field" x="90" y="282">RegionId, UserType</text>
  <rect class="box" x="330" y="185" width="200" height="126"/>
  <text class="head" x="350" y="213">Organizations</text>
  <text class="field" x="350" y="238">PK Oid</text>
  <text class="field" x="350" y="260">Name, Suffix, Status</text>
  <text class="field" x="350" y="282">Portal flags</text>
  <rect class="box" x="190" y="365" width="220" height="126"/>
  <text class="head" x="210" y="393">IdentifiedOrganizations</text>
  <text class="field" x="210" y="418">UserAccountId</text>
  <text class="field" x="210" y="440">OrganizationId</text>
  <text class="field" x="210" y="462">IsAdministrator</text>
