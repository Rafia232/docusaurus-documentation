  <text class="head" x="1215" y="388">IdentifiedRoleActions</text>
  <text class="field" x="1215" y="413">Role</text>
  <text class="field" x="1215" y="435">Feature</text>
  <text class="field" x="1215" y="457">ActionType</text>
