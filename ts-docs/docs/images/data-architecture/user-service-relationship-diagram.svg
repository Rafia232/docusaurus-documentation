  <path class="dash" d="M1420 297 C1420 330 1390 350 1375 360"/>
  <path class="dash" d="M1125 236 C1030 220 420 145 270 215"/>
  <text class="label" x="1027" y="213">access belongs to user</text>

  <rect class="group" x="40" y="590" width="470" height="360"/>
  <text class="groupTitle" x="65" y="623">Departments and Packages</text>
  <rect class="box4" x="75" y="660" width="165" height="105"/>
  <text class="head" x="95" y="688">Departments</text>
  <text class="field" x="95" y="713">PK Oid</text>
  <text class="field" x="95" y="735">Name</text>
  <rect class="box4" x="275" y="660" width="195" height="105"/>
  <text class="head" x="295" y="688">UserDepartments</text>
  <text class="field" x="295" y="713">DepartmentId</text>
  <text class="field" x="295" y="735">IdentifiedUserId</text>
  <path class="rel" d="M240 712 L275 712"/>
  <rect class="box4" x="75" y="815" width="165" height="95"/>
  <text class="head" x="95" y="843">Packages</text>
  <text class="field" x="95" y="868">Title</text>
  <text class="field" x="95" y="890">IsActive</text>
  <rect class="box4" x="275" y="815" width="195" height="95"/>
  <text class="head" x="295" y="843">PackageFeatures</text>
  <text class="field" x="295" y="868">PackageId</text>
  <text class="field" x="295" y="890">Description</text>
  <path class="rel" d="M240 862 L275 862"/>

  <rect class="group" x="555" y="590" width="995" height="360"/>
  <text class="groupTitle" x="580" y="623">Organization Services and Automation</text>
  <rect class="box" x="595" y="660" width="230" height="105"/>
