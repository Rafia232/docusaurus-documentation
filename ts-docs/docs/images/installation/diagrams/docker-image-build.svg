<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Docker Image Build Map</title>
  <desc id="desc">Docker image build map from the TeraSupport solution root to each Dockerfile and the container registry.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.bg{fill:#f8fafc}.root{fill:#fff7ed;stroke:#ea580c}.svc{fill:#f0fdf4;stroke:#16a34a}.web{fill:#eef2ff;stroke:#4f46e5}.reg{fill:#fdf2f8;stroke:#db2777}.box{stroke-width:2;rx:8}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.title{font:700 26px Arial,sans-serif;fill:#0f172a}.label{font:700 13px Arial,sans-serif;fill:#0f172a}.small{font:12px Arial,sans-serif;fill:#475569}</style>
  </defs>
  <rect class="bg" width="1280" height="620"/>
  <text class="title" x="38" y="46">Docker Image Build Map</text>
  <text class="small" x="40" y="70">Build every image from the solution root, tag consistently, then push the same image set used by Portainer stacks.</text>
  <rect class="box root" x="45" y="270" width="190" height="80"/><text class="label" x="95" y="304">Solution Root</text><text class="small" x="78" y="326">TeraSupport_Avolytic</text>
  <g>
    <rect class="box svc" x="330" y="95" width="210" height="54"/><text class="label" x="364" y="128">ApiGateway/Dockerfile</text>
    <rect class="box svc" x="330" y="160" width="210" height="54"/><text class="label" x="386" y="193">User/Dockerfile</text>
    <rect class="box svc" x="330" y="225" width="210" height="54"/><text class="label" x="374" y="258">Ticketing/Dockerfile</text>
    <rect class="box svc" x="330" y="290" width="210" height="54"/><text class="label" x="391" y="323">CRM/Dockerfile</text>
    <rect class="box svc" x="330" y="355" width="210" height="54"/><text class="label" x="374" y="388">CallCenter/Dockerfile</text>
    <rect class="box svc" x="330" y="420" width="210" height="54"/><text class="label" x="350" y="453">DeviceManagement/Dockerfile</text>
    <rect class="box svc" x="330" y="485" width="210" height="54"/><text class="label" x="391" y="518">Mail/Dockerfile</text>
  </g>
  <g>
    <rect class="box svc" x="660" y="160" width="210" height="54"/><text class="label" x="718" y="193">Meta/Dockerfile</text>
    <rect class="box web" x="660" y="255" width="210" height="54"/><text class="label" x="720" y="288">Web/Dockerfile</text>
    <rect class="box web" x="660" y="350" width="210" height="54"/><text class="label" x="711" y="383">Nginx/Dockerfile</text>
  </g>
  <rect class="box reg" x="1010" y="250" width="220" height="110"/><text class="label" x="1062" y="292">Container Registry</text><text class="small" x="1045" y="318">versioned tags for release</text><text class="small" x="1065" y="338">Portainer deploys here</text>
  <path class="line" d="M235 310 C270 122 290 122 330 122"/><path class="line" d="M235 310 C278 187 292 187 330 187"/><path class="line" d="M235 310 C278 252 292 252 330 252"/><path class="line" d="M235 310 H330"/><path class="line" d="M235 310 C278 382 292 382 330 382"/><path class="line" d="M235 310 C278 447 292 447 330 447"/><path class="line" d="M235 310 C278 512 292 512 330 512"/>
  <path class="line" d="M540 187 H660"/><path class="line" d="M540 317 H660"/><path class="line" d="M540 382 H660"/>
  <path class="line" d="M870 187 C950 210 980 245 1010 282"/><path class="line" d="M870 282 H1010"/><path class="line" d="M870 377 C950 360 980 342 1010 326"/>
</svg>
