<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#111827}.small{font:400 15px Arial,sans-serif;fill:#4b5563}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:12}.entry{fill:#eef2ff;stroke:#6d5dfc;stroke-width:2;rx:12}.svc{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.data{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.msg{fill:#fdf2f8;stroke:#ec4899;stroke-width:2;rx:12}.label{font:700 16px Arial,sans-serif;fill:#111827}.text{font:400 13px Arial,sans-serif;fill:#374151}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1200" height="650"/>
  <text class="title" x="42" y="54">IIS Deployment Flow</text>
  <text class="small" x="42" y="82">Windows Server hosts the web app, API Gateway, and supported .NET services behind IIS.</text>
  <rect class="entry" x="55" y="150" width="190" height="76"/><text class="label" x="105" y="182">Browser</text><text class="text" x="90" y="205">HTTPS request</text>
  <rect class="entry" x="330" y="150" width="210" height="76"/><text class="label" x="400" y="182">IIS</text><text class="text" x="360" y="205">URL Rewrite and ARR</text>
  <rect class="entry" x="625" y="150" width="210" height="76"/><text class="label" x="690" y="182">Web App</text><text class="text" x="675" y="205">Static React files</text>
  <rect class="entry" x="625" y="315" width="210" height="76"/><text class="label" x="675" y="347">API Gateway</text><text class="text" x="690" y="370">Ocelot</text>
  <rect class="svc" x="930" y="230" width="190" height="86"/><text class="label" x="960" y="262">Service IIS Apps</text><text class="text" x="972" y="286">User, Ticketing, Mail</text>
  <rect class="data" x="930" y="425" width="190" height="86"/><text class="label" x="975" y="457">PostgreSQL</text><text class="text" x="960" y="481">User, Ticket, Mail DBs</text>
  <path class="line" d="M245 188 L330 188"/><path class="line" d="M540 188 L625 188"/><path class="line" d="M435 226 C475 305 550 345 625 353"/><path class="line" d="M835 353 C885 330 900 285 930 273"/><path class="line" d="M1025 316 L1025 425"/>
</svg>
