<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="560" viewBox="0 0 1250 560">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#111827}.small{font:400 15px Arial,sans-serif;fill:#4b5563}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:12}.entry{fill:#eef2ff;stroke:#6d5dfc;stroke-width:2;rx:12}.svc{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.data{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.msg{fill:#fdf2f8;stroke:#ec4899;stroke-width:2;rx:12}.label{font:700 16px Arial,sans-serif;fill:#111827}.text{font:400 13px Arial,sans-serif;fill:#374151}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1250" height="560"/>
  <text class="title" x="40" y="54">Kafka Event Flow</text>
  <text class="small" x="40" y="82">Ticket, message, email, and user events move asynchronously through Kafka topics.</text>
  <rect class="entry" x="60" y="150" width="140" height="58"/><text class="label" x="95" y="185">Web</text>
  <rect class="entry" x="265" y="150" width="165" height="58"/><text class="label" x="305" y="185">Gateway</text>
  <rect class="svc" x="500" y="95" width="150" height="58"/><text class="label" x="535" y="130">Ticketing</text>
  <rect class="svc" x="500" y="225" width="150" height="58"/><text class="label" x="554" y="260">User</text>
  <rect class="msg" x="730" y="150" width="150" height="58"/><text class="label" x="783" y="185">Kafka</text>
  <rect class="svc" x="960" y="150" width="150" height="58"/><text class="label" x="1005" y="185">Mail</text>
  <rect class="msg" x="730" y="330" width="150" height="58"/><text class="label" x="765" y="365">Kafdrop</text>
  <path class="line" d="M200 179 L265 179"/><path class="line" d="M430 179 L500 124"/><path class="line" d="M430 179 L500 254"/><path class="line" d="M650 124 L730 179"/><path class="line" d="M650 254 L730 179"/><path class="line" d="M880 179 L960 179"/><path class="line" d="M805 208 L805 330"/>
  <text class="text" x="690" y="455">Topics are monitored during deployment to confirm ticket creation, message, and email events are flowing.</text>
</svg>
