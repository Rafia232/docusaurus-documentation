<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px Arial,sans-serif;fill:#111827}.small{font:400 15px Arial,sans-serif;fill:#4b5563}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:12}.entry{fill:#eef2ff;stroke:#6d5dfc;stroke-width:2;rx:12}.svc{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:12}.data{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:12}.msg{fill:#fdf2f8;stroke:#ec4899;stroke-width:2;rx:12}.label{font:700 16px Arial,sans-serif;fill:#111827}.text{font:400 13px Arial,sans-serif;fill:#374151}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1500" height="760"/>
  <text class="title" x="50" y="55">TeraSupport Deployment Overview</text>
  <text class="small" x="50" y="84">Supported public deployment scope for web, gateway, core services, databases, and Kafka messaging.</text>
  <rect class="entry" x="60" y="155" width="190" height="74"/><text class="label" x="105" y="187">Users</text><text class="text" x="90" y="210">Facility / Regional / Admin</text>
  <rect class="entry" x="330" y="155" width="190" height="74"/><text class="label" x="378" y="187">Nginx</text><text class="text" x="360" y="210">HTTPS entry point</text>
  <rect class="entry" x="600" y="155" width="190" height="74"/><text class="label" x="665" y="187">Web</text><text class="text" x="635" y="210">React / Vite UI</text>
  <rect class="entry" x="870" y="155" width="210" height="74"/><text class="label" x="920" y="187">API Gateway</text><text class="text" x="920" y="210">Ocelot routes</text>
  <path class="line" d="M250 192 L330 192"/><path class="line" d="M520 192 L600 192"/><path class="line" d="M790 192 L870 192"/>
  <rect class="svc" x="650" y="330" width="180" height="82"/><text class="label" x="690" y="362">User Service</text><text class="text" x="688" y="386">Identity and access</text>
  <rect class="svc" x="920" y="330" width="180" height="82"/><text class="label" x="955" y="362">Ticketing</text><text class="text" x="948" y="386">Tickets and reports</text>
  <rect class="svc" x="1190" y="330" width="180" height="82"/><text class="label" x="1232" y="362">Mail Service</text><text class="text" x="1222" y="386">Email processing</text>
  <path class="line" d="M970 229 L740 330"/><path class="line" d="M975 229 L1010 330"/><path class="line" d="M1030 229 L1280 330"/>
  <rect class="data" x="650" y="535" width="180" height="82"/><text class="label" x="694" y="567">TSUserDB</text><text class="text" x="690" y="591">PostgreSQL</text>
  <rect class="data" x="920" y="535" width="180" height="82"/><text class="label" x="958" y="567">TSTicketDb</text><text class="text" x="960" y="591">PostgreSQL</text>
  <rect class="data" x="1190" y="535" width="180" height="82"/><text class="label" x="1238" y="567">TSMailDB</text><text class="text" x="1230" y="591">PostgreSQL</text>
  <path class="line" d="M740 412 L740 535"/><path class="line" d="M1010 412 L1010 535"/><path class="line" d="M1280 412 L1280 535"/>
  <rect class="msg" x="300" y="410" width="210" height="82"/><text class="label" x="378" y="442">Kafka</text><text class="text" x="340" y="466">Broker and topics</text>
  <rect class="msg" x="300" y="555" width="210" height="70"/><text class="label" x="370" y="586">Kafdrop</text><text class="text" x="340" y="608">Topic inspection</text>
  <path class="line" d="M650 370 C560 370 535 440 510 450"/><path class="line" d="M920 370 C730 370 620 420 510 450"/><path class="line" d="M1190 370 C885 380 650 430 510 450"/><path class="line" d="M405 492 L405 555"/>
</svg>
